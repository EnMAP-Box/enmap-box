name: 🧪 EnMAP-Box Tests

on:
  push:
    branches:
      - main**
      - release-**
      - release_**

  pull_request:
    branches:
      - main**
      - release-**
      - release_**

  release:
    types: [ published ]

jobs:
  # Run EnMAP-Box tests
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        qgis_version: [ 'latest', 'stable' ]
      fail-fast: true

    env:
      QGIS_VERSION: ${{ matrix.qgis_version}}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Docker Environment Info
        run: |
          # ls -la .docker/
          # ls -la
          # ls -la ~
          # ls -la /usr/bin
          docker --version
          lsb_release -a
      - name: System Info
        run: |
          chmod +x .env/docker/docker-python.sh
          .env/docker/docker-python.sh scripts/systeinfo.py

      - name: Setup Repository
        run: |
          .env/docker/docker-python.sh scripts/setup_repository.py

      - name: Test EnMAP-Box on QGIS
        run: |
          chmod +x scripts/runtests_docker.sh
          ./scripts/runtests_docker.sh -n auto
        # docker compose -f .env/docker/docker-compose.gh.yml run qgis /usr/src/.env/docker/run_docker_tests.sh -n auto
