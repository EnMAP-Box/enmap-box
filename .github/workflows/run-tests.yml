name: 🧪 Tests (Docker)

on:
  push:
    branches:
      - main**
      - release-**
      - release_**

  pull_request:
    branches:
      - main**
      - release-**
      - release_**

  release:
    types: [ published ]

  workflow_dispatch:

jobs:
  # Run EnMAP-Box tests
  test:
    name: QGIS ${{ matrix.qgis_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        qgis_version: [ '4.2', '4.4' ]
      fail-fast: false

    env:
      QGIS_VERSION: ${{ matrix.qgis_version}}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Docker Environment Info
        run: |
          docker --version
          lsb_release -a

      - name: Setup Repository
        run: |
          chmod +x .env/docker/docker-python.sh
          .env/docker/docker-python.sh scripts/setup_repository.py

      - name: Test EnMAP-Box on QGIS
        run: |
          chmod +x scripts/runtests_docker.sh
          ./scripts/runtests_docker.sh -n auto --cov=enmapbox --cov-report=xml
        env:
          QGIS_VERSION: ${{ matrix.qgis_version }}
